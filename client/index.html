<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#07121c"
  />

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <meta
    name="format-detection"
    content="telephone=no"
  />

  <title>MAZE HUNTER</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 30%,
          #102b3b 0%,
          #07121c 55%,
          #03080d 100%
        );

      overscroll-behavior: none;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;

      -webkit-touch-callout: none;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      position: relative;

      width: 100vw;
      height: 100dvh;

      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      touch-action: none;
    }

    canvas {
      display: block;

      max-width: 100vw;
      max-height: 100dvh;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;

      -webkit-touch-callout: none;

      image-rendering: auto;
    }

    /* -------------------------------------------------------
       PORTRAIT DEVICE
       ------------------------------------------------------- */

    @media (orientation: portrait) {
      #game {
        width: 100vw;
        height: 100dvh;
      }
    }

    /* -------------------------------------------------------
       LANDSCAPE DEVICE
       ------------------------------------------------------- */

    @media (orientation: landscape) {
      #game {
        width: 100vw;
        height: 100dvh;
      }
    }

    /* -------------------------------------------------------
       SMALL PHONES
       ------------------------------------------------------- */

    @media (max-width: 380px) {
      #game {
        width: 100vw;
        height: 100dvh;
      }
    }

    /* -------------------------------------------------------
       NOTCH / SAFE AREA
       ------------------------------------------------------- */

    @supports (
      padding: env(safe-area-inset-top)
    ) {
      #game {
        padding-top:
          env(safe-area-inset-top);

        padding-right:
          env(safe-area-inset-right);

        padding-bottom:
          env(safe-area-inset-bottom);

        padding-left:
          env(safe-area-inset-left);
      }
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
